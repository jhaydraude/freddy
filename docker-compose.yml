services:
  prediction-service:
    build:
      context: .
      dockerfile: packages/predictive-models/Dockerfile
    container_name: freddy-prediction
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3000}
    networks:
      - freddy

  webapp:
    build:
      context: .
      dockerfile: packages/webapp/Dockerfile
    container_name: freddy-webapp
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - MONGO_URI=${MONGO_URI:-mongodb://localhost:27017/nightscout}
      - PREDICTION_SERVICE_URL=${PREDICTION_SERVICE_URL:-http://prediction-service:8000}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - NODE_ENV=${NODE_ENV:-production}
    depends_on:
      - prediction-service
    networks:
      - freddy

networks:
  freddy:
    driver: bridge
